name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['1.21.11', '26.1', '26.1.1', '26.1.2', '26.2', '26.3']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Build
        run: ./gradlew --no-daemon --configure-on-demand :${{ matrix.minecraft }}:build :${{ matrix.minecraft }}:compileGametestJava
      - name: Install graphics drivers
        if: matrix.minecraft == '26.3'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1-mesa-dev mesa-vulkan-drivers
      - name: Test client
        timeout-minutes: 10
        run: ./gradlew --no-daemon --configure-on-demand :${{ matrix.minecraft }}:runClientGameTest
        env:
          LIBGL_ALWAYS_SOFTWARE: 'true'
          SDL_VIDEO_FORCE_EGL: '1'
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: screenshots-${{ matrix.minecraft }}
          path: versions/${{ matrix.minecraft }}/build/run/clientGameTest/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bundle-tab-${{ matrix.minecraft }}
          path: |
            versions/${{ matrix.minecraft }}/build/libs/*.jar
            !versions/${{ matrix.minecraft }}/build/libs/*-sources.jar

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: bundle-tab-*
          merge-multiple: true
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.jar --verify-tag --title "$TAG" --generate-notes
